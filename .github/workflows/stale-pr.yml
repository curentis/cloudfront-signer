name: "Close stale PRs"

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          stale-pr-message: 'This PR is stale because it has been open 7 days with no activity. It will be closed in 7 days if no further activity occurs.'
          close-pr-message: 'This PR was closed because it has been inactive for 14 days.'
          days-before-pr-stale: 7
          days-before-pr-close: 7
          stale-pr-label: 'stale'
